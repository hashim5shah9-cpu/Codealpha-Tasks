<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialMedia</title>
    <link rel="stylesheet" href="../static/css/style.css">
    <style>
        :root {
            --bg: #07070b;
            --text: #f5f5f7;
            --text-2: #b7b7c9;
            --cyan: #25f4ee;
            --grad: linear-gradient(135deg, #f9ce34, #ee2a7b 45%, #6228d7);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body.landing {
            min-height: 100vh;
            font-family: Outfit, "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(900px 420px at 10% -10%, rgba(254,44,85,.18), transparent 60%),
                radial-gradient(700px 380px at 100% 0%, rgba(37,244,238,.12), transparent 55%),
                var(--bg);
        }
        a { color: inherit; text-decoration: none; }
        .brand { font-size: 22px; font-weight: 800; }
        .brand span {
            background: var(--grad);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 9px 16px; border-radius: 999px; border: 1px solid transparent;
            font-weight: 700; font-family: inherit; cursor: pointer;
        }
        .btn--primary { background: var(--grad); color: #fff; }
        .btn--outline { background: transparent; border-color: #8b8ba3; color: #fff; }
        .btn--ghost { background: transparent; color: var(--text-2); }
        .landing-nav {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 28px;
        }
        .landing-actions, .landing-cta { display: flex; gap: 10px; flex-wrap: wrap; }
        .landing-hero { max-width: 980px; margin: 0 auto; padding: 48px 24px 80px; }
        .landing-kicker {
            color: var(--cyan); font-weight: 700; letter-spacing: .12em;
            text-transform: uppercase; font-size: 12px;
        }
        .landing-hero h1 {
            font-size: clamp(40px, 6vw, 68px); line-height: .95;
            font-weight: 800; margin: 12px 0 16px;
        }
        .landing-lead { color: var(--text-2); font-size: 18px; max-width: 460px; }
        .landing-cta { margin: 22px 0 32px; }
        .landing-preview { display: grid; grid-template-columns: 1.1fr .8fr; gap: 16px; }
        .preview-card {
            min-height: 280px; border-radius: 22px; overflow: hidden;
            display: grid; place-items: center; padding: 28px; text-align: center;
        }
        .preview-card p, .preview-card span { font-size: 28px; font-weight: 800; }
        .preview-post { background: var(--grad); }
        .preview-reel { background: linear-gradient(180deg, #6228d7, #ee2a7b 55%, #f9ce34); }
        @media (max-width: 640px) {
            .landing-nav { padding: 14px 16px; }
            .landing-preview { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="landing">
    <header class="landing-nav">
        <a class="brand" href="index.html">Social<span>Media</span></a>
        <nav class="landing-actions">
            <a class="btn btn--ghost" data-href="/login/">Log in</a>
            <a class="btn btn--primary" data-href="/register/">Sign up</a>
        </nav>
    </header>

    <main class="landing-hero">
        <p class="landing-kicker">Home · Explore · Profile</p>
        <h1>Share posts.<br>Follow people.<br>Like what you love.</h1>
        <p class="landing-lead">A mini social platform for profiles, posts, comments, likes, and follows.</p>
        <div class="landing-cta">
            <a class="btn btn--primary" data-href="/register/">Create account</a>
            <a class="btn btn--outline" data-href="/login/">Log in</a>
        </div>
        <div class="landing-preview">
            <article class="preview-card preview-post"><p>Your next post starts here.</p></article>
            <article class="preview-card preview-reel"><span>For You</span></article>
        </div>
    </main>
    <script>
        (function () {
            var origin = location.protocol === "file:" ? "http://127.0.0.1:8765" : "";
            var links = document.querySelectorAll("[data-href]");
            for (var i = 0; i < links.length; i++) {
                links[i].href = origin + links[i].getAttribute("data-href");
            }
        })();
    </script>
</body>
</html>
