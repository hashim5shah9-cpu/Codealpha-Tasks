{% extends "base.html" %}
{% block title %}Log in — Harbor &amp; Oak{% endblock %}
{% block main_class %}{% endblock %}
{% block content %}
<section class="auth-layout">
  <div class="auth">
    <p class="kicker">Account</p>
    <h1>Welcome back.</h1>
    <p class="lede">Your bag and orders live here.</p>
    <form method="post" class="form">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Log in</button>
    </form>
    <p>New here? <a class="accent-link" href="{% url 'register' %}">Create an account</a>.</p>
  </div>
  <div class="auth-visual" role="img" aria-label="Interior with oak furniture"></div>
</section>
{% endblock %}
